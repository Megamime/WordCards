<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelime Kartları">
<meta name="theme-color" content="#2b4a8b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kelime Kartları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--fg:#1b2333;--mut:#667089;--card:#fff;--line:#d5dbe7;--ink:#2b4a8b;--on:#fff;--red:#d64f4f;--rule:#e8edf6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--fg:#e8ecf5;--mut:#98a2bb;--card:#1a1f2c;--line:#2c3448;--ink:#8db0ff;--on:#0e1626;--red:#e2726b;--rule:#212839}}
:root[data-theme="dark"]{--bg:#11141b;--fg:#e8ecf5;--mut:#98a2bb;--card:#1a1f2c;--line:#2c3448;--ink:#8db0ff;--on:#0e1626;--red:#e2726b;--rule:#212839}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0 auto;max-width:560px;padding:12px 16px 40px;background:var(--bg);color:var(--fg);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:6px;margin-bottom:14px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 6px;flex:1}
nav button.on,.p{background:var(--ink);color:var(--on);border-color:var(--ink)}
.p{width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{min-height:230px;padding:24px 18px 20px;border:1px solid var(--line);border-radius:14px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:12px;background:linear-gradient(var(--red),var(--red)) 0 42px/100% 2px no-repeat,repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px),var(--card)}
.f{font-size:30px;font-weight:600;overflow-wrap:anywhere}
.b{font-size:22px;color:var(--ink);overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin-top:12px}
.row small{display:block;color:var(--mut);font-size:12px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0 8px}
textarea{min-height:110px}
h3{margin:20px 0 4px;font-size:16px}
</style></head>
<body>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const K='kk1',DAY=864e5;
let S={cards:[],lim:10,nd:{k:0,n:0}},tab='s',cur=null,shown=false,msg='',ok=true;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=i=>document.getElementById(i),day=()=>new Date().setHours(0,0,0,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(f,b)=>({f,b,s:0,d:0,i:0,e:2.5,l:0});
function save(){try{localStorage.setItem(K,JSON.stringify(S));ok=true}catch(e){ok=false}}
function newLeft(){const t=day();if(S.nd.k!==t)S.nd={k:t,n:0};return Math.max(0,S.lim-S.nd.n)}
function sched(c,g){const r={...c},n=Date.now();
 if(c.s<2){
  if(g<2){r.s=1;r.d=n+(g?3e5:6e4)}
  else{r.s=2;r.i=Math.max(g==2?1:4,c.i);r.d=day()+r.i*DAY}
 }else if(g==0){r.s=1;r.l=c.l+1;r.e=Math.max(1.3,c.e-.2);r.i=Math.max(1,Math.round(c.i*.3));r.d=n+6e5}
 else{const m=[0,1.2,c.e,c.e*1.3][g];r.i=Math.max(c.i+(g==3?2:1),Math.round(c.i*m));r.e=Math.max(1.3,c.e+[0,-.15,0,.15][g]);r.d=day()+r.i*DAY}
 return r}
const lab=(c,g)=>{const r=sched(c,g);return r.s==1?Math.max(1,Math.round((r.d-Date.now())/6e4))+' dk':r.i+' gün'};
function pick(){const n=Date.now(),L=S.cards;
 return L.filter(c=>c.s>0&&c.d<=n).sort((a,b)=>a.d-b.d)[0]||(newLeft()>0?L.find(c=>c.s==0):0)||L.filter(c=>c.s==1).sort((a,b)=>a.d-b.d)[0]}
function grade(g){const i=S.cards.indexOf(cur);if(cur.s==0){newLeft();S.nd.n++}S.cards[i]=sched(cur,g);save();cur=null;shown=false;render()}
function add1(){const f=$('f').value.trim(),b=$('b').value.trim();
 if(!f||!b)msg='İki alanı da doldur.';
 else if(S.cards.some(c=>c.f.toLowerCase()==f.toLowerCase()))msg='Bu kart zaten var.';
 else{S.cards.push(mk(f,b));save();msg='"'+f+'" eklendi.'}
 render()}
function imp(){const seen=new Set(S.cards.map(c=>c.f.toLowerCase()));let a=0,d=0;
 $('t').value.split(/\r?\n/).forEach(l=>{const j=l.search(/\t|;|\|/);if(j<1)return;const f=l.slice(0,j).trim(),b=l.slice(j+1).trim();
  if(!f||!b)return;if(seen.has(f.toLowerCase())){d++;return}seen.add(f.toLowerCase());S.cards.push(mk(f,b));a++});
 save();msg=a+' kart eklendi'+(d?', '+d+' tekrar atlandı':'')+'.';render()}
function note(t){msg=t;if($('nt'))$('nt').textContent=t}
function ex(){const t=JSON.stringify(S);$('bk').value=t;$('bk').select();
 try{navigator.clipboard.writeText(t).then(()=>note('Kopyalandı. Bir notlar uygulamasına yapıştırıp sakla.'),()=>note('Metni elle kopyala.'))}catch(e){note('Metni elle kopyala.')}}
function im2(){try{const o=JSON.parse($('bk').value);if(!Array.isArray(o.cards))throw 0;S=Object.assign({cards:[],lim:10,nd:{k:0,n:0}},o);save();note(S.cards.length+' kart yüklendi.');render()}catch(e){note('Yedek okunamadı. Metnin tamamını yapıştırdığından emin ol.')}}
function wipe(){if(!wipe.a){wipe.a=1;note('Emin misin? Silmek için tekrar dokun.');return}wipe.a=0;S.cards=[];save();note('Tüm kartlar silindi.');render()}
function render(){
 $('nav').innerHTML=[['s','Çalış'],['a','Ekle'],['x','Ayarlar']].map(([k,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';msg='';wipe.a=0;cur=null;shown=false;render()">${t}</button>`).join('');
 const m=$('m');
 if(tab=='s'){
  const n=Date.now();cur=cur||pick();
  const y=Math.min(newLeft(),S.cards.filter(c=>c.s==0).length),t=S.cards.filter(c=>c.s>0&&c.d<=n).length;
  let h=`<p class="mut"><b>${y}</b> yeni, <b>${t}</b> tekrar bekliyor.${ok?'':' Kayıt yapılamıyor: Ayarlar\'dan yedek al.'}</p>`;
  if(!cur)h+=`<div class="card"><div class="f">${S.cards.length?'Bugünlük bitti':'Henüz kart yok'}</div><div class="mut">${S.cards.length?'Yeni kartlar yarın açılır.':'Ekle sekmesinden kelime ekle.'}</div></div>`;
  else{h+=`<div class="card"><div class="f">${esc(cur.f)}</div>${shown?`<div class="b">${esc(cur.b)}</div>`:''}</div>`;
   h+=shown?`<div class="row">${['Tekrar','Zor','İyi','Kolay'].map((x,g)=>`<button onclick="grade(${g})">${x}<small>${lab(cur,g)}</small></button>`).join('')}</div>`:`<div class="row"><button class="p" onclick="shown=true;render()">Cevabı göster</button></div>`}
  m.innerHTML=h}
 else if(tab=='a')
  m.innerHTML=`<h3>Tek kart ekle</h3><input id="f" placeholder="İngilizce (apple)" autocapitalize="off" autocomplete="off"><input id="b" placeholder="Türkçesi (elma)" autocomplete="off"><button class="p" onclick="add1()">Kartı ekle</button><h3>Toplu ekle</h3><p class="mut">Her satıra bir kart yaz: kelime ; anlam. Ayırıcı olarak ; ya da tab kullanabilirsin.</p><textarea id="t" placeholder="apple ; elma"></textarea><button class="p" onclick="imp()">İçe aktar</button><p class="mut">${esc(msg)}</p>`;
 else{
  const st=S.cards.reduce((a,c)=>(a[c.s==0?0:(c.s==1||c.i<21)?1:2]++,a),[0,0,0]);
  m.innerHTML=`<h3>Günlük yeni kart sayısı</h3><input type="number" inputmode="numeric" min="1" max="100" value="${S.lim}" onchange="S.lim=Math.max(1,Math.min(100,+this.value||10));save()"><p class="mut">${S.cards.length} kart: ${st[0]} yeni, ${st[1]} öğreniliyor, ${st[2]} olgun (21+ gün).</p><h3>Yedek</h3><p class="mut">Kartların bu tarayıcıda saklanır. Ara sıra yedeği kopyalayıp bir notlar uygulamasına yapıştır.</p><textarea id="bk" placeholder="Yedek burada görünür. Geri yüklemek için yedeği buraya yapıştır."></textarea><div class="row"><button onclick="ex()">Yedeği göster</button><button onclick="im2()">Yedekten yükle</button></div><p class="mut" id="nt">${esc(msg)}</p><button onclick="wipe()" style="width:100%">Tüm kartları sil</button>`}
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
